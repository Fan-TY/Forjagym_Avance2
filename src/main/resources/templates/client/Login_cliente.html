<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/styles.css">
    <title>FORJAGYM</title>
</head>

<body>

<main>

    <div class="min-vh-100 d-flex justify-content-center">

        <!-- LADO IZQUIERDO -->
        <div class="col-6 bg-primary d-flex flex-column text-white justify-content-center p-5">

            <p class="display-5 mb-1 fw-bold">
                Entrena sin límites
            </p>

            <p class="fs-4">
                Entrena con equipos de primer nivel y un plan hecho
                para tus objetivos, sin importar tu punto de partida.
            </p>

        </div>


        <!-- LADO DERECHO -->
        <div class="col-6 justify-content-center d-flex flex-column p-5">

                <span class="fs-3 fw-bold text-primary mb-4">
                    <i class="bi bi-fire fs-2"></i>
                    FORJAGYM
                </span>

            <p class="display-6 text-secondary fw-bold mb-0">
                Iniciar sesión
            </p>

            <p class="fs-5 text-secondary">
                Bienvenido de nuevo, socio
            </p>


            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
            </div>


            <!-- FORMULARIO -->
            <form th:action="@{/client/login}" method="post">

                <label for="email" class="form-label">
                    Correo electrónico
                </label>

                <input type="email" id="email" name="email" class="form-control mb-3" placeholder="correo@gmail.com"
                       required>

                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input type="password" id="password" name="password" class="form-control mb-3"
                       placeholder="**********" required>

                <button class="btn btn-outline-primary mt-2" type="submit">
                    Ingresar
                </button>

            </form>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
