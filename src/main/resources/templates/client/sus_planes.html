<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <title>Planes - FORJAGYM</title>
</head>

<div th:replace="~{fragments_cliente :: header}"></div>

<main>
    <div class="container d-flex flex-column justify-content-center flex-grow-1 min-vh-100">

        <div class="nav nav-pills gap-2 mb-5">
            <div class="nav-item">
                <button class="nav-link active" type="button">Todos</button>
            </div>
            <div class="nav-item">
                <button class="nav-link" type="button">Nuevos</button>
            </div>
            <div class="nav-item">
                <button class="nav-link" type="button">Populares</button>
            </div>
            <div class="nav-item">
                <button class="nav-link" type="button">Tiempo limitado</button>
            </div>
        </div>

        <p class="fw-bold text-primary fs-2 mb-0">
            PLANES DE ENTRENAMIENTO
        </p>

        <p class="fs-5 text-secondary">
            Elige el plan que mejor se adapte a tus objetivos.
            Sin matrícula, sin contratos forzosos, cancela cuando quieras.
        </p>

        <div class="row mt-4 pb-4">

            <div class="col-md-4 mb-4" th:each="plan : ${planes}">
                <div class="card h-100">

                    <div class="card-header text-center">

                        <div class="d-flex justify-content-center">
                            <p class="fs-3 text-primary fw-bold mb-0">S/</p>

                            <p class="fs-1 text-primary fw-bold mb-0"
                               th:text="${#numbers.formatDecimal(plan.precio, 1, 'COMMA', 2, 'POINT')}">
                                180.00
                            </p>

                            <p class="text-secondary pt-2 ms-1">
                                Mensual
                            </p>
                        </div>

                        <p class="fs-4 fw-bold text-primary mb-0" th:text="${plan.nombre}">
                            Fuerza Total
                        </p>

                    </div>

                    <div class="card-body">

                        <div th:each="beneficio : ${plan.beneficios}">
                            <p th:text="${beneficio.nombre}"></p>
                        </div>

                        <div class="d-flex justify-content-center">
                            <form th:action="@{/client/planes/cambiar}" method="post">

                                <input type="hidden"
                                       name="idSuscripcion"
                                       th:value="${plan.id}">

                                <button type="submit" class="btn btn-primary">
                                    Cambiar a este plan
                                </button>

                            </form>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments_cliente :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
