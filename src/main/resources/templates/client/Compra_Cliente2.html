<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="shortcut icon" th:href="@{/img/favicon.png}" type="image/x-icon">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <title>FORJAGYM - Método de pago</title>

</head>


<body>

<!-- NAVBAR -->

<div th:replace="~{fragments_cliente :: header}"></div>


<main>

    <div class="container d-flex pt-5 flex-grow-1 min-vh-100 flex-column">

        <p class="fs-2 text-primary fw-bold mb-0">
            TU CARRITO
        </p>

        <p class="text-secondary fs-5">
            Completa tu compra para comenzar a entrenar sin límites
        </p>


        <!-- MENSAJE DE ERROR -->

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        </div>


        <div class="row">

            <!-- PASOS -->

            <div class="col-12 mt-4 mb-4 d-flex">

                <div class="d-flex gap-3 align-items-center">

                    <div class="rounded-circle bg-primary justify-content-center align-items-center text-center d-flex text-white fw-bold"
                         style="height: 40px; width: 40px;">
                        1
                    </div>

                    <span class="text-primary fs-5">
                            Seleccionar productos
                        </span>

                </div>


                <div class="d-flex gap-3 align-items-center ms-4">

                    <div class="rounded-circle bg-primary justify-content-center align-items-center text-center d-flex text-white fw-bold"
                         style="height: 40px; width: 40px;">
                        2
                    </div>

                    <span class="text-primary fs-5 fw-bold">
                            Escoger método de pago
                        </span>

                </div>


                <div class="d-flex gap-3 align-items-center ms-4">

                    <div class="rounded-circle border border-primary justify-content-center align-items-center text-center d-flex text-primary fw-bold"
                         style="height: 40px; width: 40px;">
                        3
                    </div>

                    <span class="text-primary fs-5">
                            ¡Listo! Pedido completo
                        </span>

                </div>

            </div>


            <!-- COLUMNA MÉTODO DE PAGO -->

            <div class="col-7">

                <div class="card">

                    <div class="card-header">

                            <span class="text-secondary fw-bold">
                                Método de pago
                            </span>

                    </div>


                    <div class="card-body">

                        <!-- FORMULARIO DE PAGO -->

                        <form th:action="@{/client/pago}" method="post" id="formPago">


                            <!-- TARJETA NUEVA -->

                            <div class="border border-2 p-3 rounded-3">

                                <div class="form-check text-secondary mb-3">

                                    <input type="radio" class="form-check-input" name="esTarjetaNueva"
                                           id="nuevaTarjeta" value="false" checked>

                                    <label class="form-check-label" for="nuevaTarjeta">

                                        <i class="bi bi-credit-card-fill me-1"></i>

                                        Nueva tarjeta

                                    </label>

                                </div>


                                <div class="row g-3">


                                    <!-- NÚMERO DE TARJETA -->

                                    <div class="col-12">

                                        <label for="numTarjeta" class="form-label">

                                            Número de tarjeta

                                        </label>

                                        <input type="text" class="form-control" id="numTarjeta" name="numTarjeta"
                                               placeholder="xxxx xxxx xxxx xxxx" required>

                                    </div>


                                    <!-- MES -->

                                    <div class="col-md-4">

                                        <label for="mesVencimiento" class="form-label">

                                            Mes

                                        </label>

                                        <select class="form-select" id="mesVencimiento" name="mesVencimiento"
                                                required>

                                            <option value="">
                                                Mes
                                            </option>

                                            <option value="1">01</option>
                                            <option value="2">02</option>
                                            <option value="3">03</option>
                                            <option value="4">04</option>
                                            <option value="5">05</option>
                                            <option value="6">06</option>
                                            <option value="7">07</option>
                                            <option value="8">08</option>
                                            <option value="9">09</option>
                                            <option value="10">10</option>
                                            <option value="11">11</option>
                                            <option value="12">12</option>

                                        </select>

                                    </div>


                                    <!-- AÑO -->

                                    <div class="col-md-4">

                                        <label for="anioVencimiento" class="form-label">

                                            Año

                                        </label>

                                        <input type="number" class="form-control" id="anioVencimiento"
                                               name="anioVencimiento" placeholder="2028" min="2026" required>

                                    </div>


                                    <!-- CVV -->

                                    <div class="col-md-4">

                                        <label for="numCVV" class="form-label">

                                            CVV

                                        </label>

                                        <input type="text" class="form-control" id="numCVV" name="numCVV"
                                               placeholder="123" maxlength="4" required>

                                    </div>


                                    <!-- TITULAR -->

                                    <div class="col-12">

                                        <label for="nombreTitular" class="form-label">

                                            Nombre del titular

                                        </label>

                                        <input type="text" class="form-control" id="nombreTitular"
                                               name="nombreTitular" placeholder="Nombre del titular" required>

                                    </div>


                                    <!-- TIPO DE TARJETA -->

                                    <div class="col-12">

                                        <label for="tipoTarjeta" class="form-label">

                                            Tipo de tarjeta

                                        </label>

                                        <select class="form-select" id="tipoTarjeta" name="tipoTarjeta" required>

                                            <option value="">
                                                Selecciona una tarjeta
                                            </option>

                                            <option value="VISA">
                                                Visa
                                            </option>

                                            <option value="MASTERCARD">
                                                Mastercard
                                            </option>

                                        </select>

                                    </div>

                                </div>

                            </div>


                            <!-- BOTONES -->

                            <div class="mt-4">

                                <button class="btn btn-primary" type="submit">

                                    Confirmar pago

                                </button>


                                <a class="btn btn-outline-primary" th:href="@{/client/pedido}">

                                    Volver

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>


            <!-- RESUMEN -->

            <div class="col-5">

                <div class="card bg-primary text-white rounded-4 border-0">

                    <div class="card-body">

                        <p class="fw-bold fs-5 mb-3">
                            Resumen de pago
                        </p>


                        <!-- ARTÍCULOS -->

                        <div th:each="articulo : ${compra.articulos}" class="justify-content-between d-flex mb-2">

                                <span class="fw-bold" th:text="${articulo.suscripcion.nombre}">

                                    Plan

                                </span>

                            <span>

                                    S/

                                    <span th:text="${#numbers.formatDecimal(articulo.suscripcion.precio, 1, 2)}">
                                        180.00
                                    </span>

                                </span>

                        </div>


                        <!-- TOTAL -->

                        <div class="justify-content-between d-flex fw-bold border-top border-2 pt-2">

                                <span>
                                    Total
                                </span>

                            <span>

                                    S/

                                    <span th:text="${#numbers.formatDecimal(compra.total, 1, 2)}">
                                        212.40
                                    </span>

                                </span>

                        </div>


                        <div class="bg-white bg-opacity-25 rounded-3 mt-3 py-2 px-2">

                            <p class="mb-0 mx-1">
                                El pago se registrará automáticamente.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->

<div th:replace="~{fragments_cliente :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
