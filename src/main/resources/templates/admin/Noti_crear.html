<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <header class="sticky-top">
        <div class=" bg-body shadow-sm">
            <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
        </div>
    </header>

    <main>
        <!-- PAGINA 1 -->
        <div class="">
            <div class="container d-flex flex-column justify-content-start flex-grow-1 min-vh-100">

                <div class="text-center p-3 w-75 mx-auto mb-4 text-danger mt-4 rounded-4 border border-danger border-2 ">
                    <p class="mb-0 fs-2 fw-bold">CREAR NOTIFICACIÓN</p>
                    <p class="mb-0 fs-5">Completa los datos para crear una nueva notificación</p>
                </div>


                <div class="card w-75 mx-auto  border-0 shadow-sm px-4 py-3 mb-4">
                    <div class="card-body">
                        <form action="" class="form-group">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="" class="form-label">Titulo de la notificación</label>
                                    <input type="text" class="form-control" placeholder="Cardio Avanzado">
                                </div>
                                <div class="col-12">
                                    <label for="" class="form-label">Tipo de notificación</label>
                                    <select name="" id="" class="form-select">
                                        <option value="">Nueva suscripción</option>
                                        <option value="">Actualización</option>
                                        <option value="">Recordatorio</option>
                                    </select>
                                </div>


                                
                                <div class="col-6">
                                    <label for="" class="form-label">Destinatario de la notificación</label>
                                    <select name="" id="" class="form-select">
                                        <option value="">Todos</option>
                                        <option value="">Por vencer</option>
                                    </select>
                                </div>  

                                <div class="col-6">
                                    <label for="" class="form-label">Estado de la notidicación</label>
                                    <select name="" id="" class="form-select">
                                        <option value="">Enviado</option>
                                        <option value="">Borrador</option>
                                    </select>
                                </div>    

                                <div class="col-12">
                                    <label for="" class="form-label">Descripción de la notificación</label>
                                    <textarea name="" id="" class="form-control" rows="3" placeholder="Rutina de alta intensidad para resistencia"></textarea>
                                </div>

                    
                                <button class="btn btn-danger text-white" onclick="window.location.href='/admin/Noti_admin.html'" type="button">Guardar cambios</button>
                                <button class="btn btn-outline-danger" onclick="window.location.href='/admin/Noti_admin.html'" type="button">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>


    </main>

    <div th:replace="~{fragments/fragment_footer :: footer}"></div>
    
<script src="/JS/sus_editar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
