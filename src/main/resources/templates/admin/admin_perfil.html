<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <header class="sticky-top">
        <div class=" bg-body shadow-sm">
            <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
        </div>
    </header>

    <main>
        <!-- PAGINA 1 -->
        <div class="">
            <div class="container d-flex flex-column justify-content-start flex-grow-1 min-vh-100 mt-5">
                <div class="">
                    <p class="fs-2 fw-bold text-danger mb-0">MI PERFIL</p>
                    <p class="fs-5 text-secondary">Revisa tu información como recepcionista de ForjaGym</p>
                </div>

                <div class="row">
                    <div class="col-12 ">
                        <div class="card py-3 px-4 shadow-sm border-0">
                            <div class="card-body align-items-center d-flex ">

                                <div class="rounded-circle bg-danger text-white d-flex align-items-center justify-content-center fs-4 fw-bold" style="height: 70px; width: 70px;"
                                th:text="${#strings.substring(admin.nombre, 0, 1) + #strings.substring(admin.apellido, 0, 1)}"></div>
                                <div class="ms-3">
                                    <h5 class="card-title text-danger fw-bold mb-1" th:text="|${admin?.nombre} ${admin?.apellido}|"></h5>
                                    <p class="mb-0" th:text="|${admin?.cod}|"></p>
                                    
                                    <span class="badge border border-danger text-secondary" th:text="|${admin?.cargo}|"></span>
                                    <span class="badge bg-danger" th:text="|${admin?.sede?.nombreSede}|"></span>
                                </div>
                            </div>
                                
                        </div>
                    </div>

                    <div class="col-6 mt-3">
                        <div class="card px-4 py-3 mb-5 border-danger">
                            <div class="card-body">
                                    <p class="mb-0 fw-bold text-danger fs-5">Datos personales</p>
                                    <div class="justify-content-between d-flex py-2 border-bottom ">
                                        <span>Usuario</span>
                                        <span th:text="|${admin?.nombre} ${admin?.apellido}|"></span>
                                    </div>

                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Cargo</span>
                                        <span th:text="|${admin?.cargo}|"></span>
                                    </div>

                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Código</span>
                                        <span th:text="|${admin?.cod}|"></span>
                                    </div>
                                    
                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Documentación</span>
                                        <span th:text="|${admin?.numDoc}|"></span>
                                    </div>

                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Correo eléctronico</span>
                                        <span th:text="|${admin?.email}|"></span>
                                    </div>

                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Teléfono</span>
                                        <span th:text="|${admin?.tel}|"></span>
                                    </div>

                                    <div class="justify-content-between d-flex py-2 border-bottom">
                                        <span>Sede</span>
                                        <span th:text="|${admin?.sede?.nombreSede}|"></span>
                                    </div>
                                    <div class="justify-content-between d-flex my-2">
                                        <span>Área </span>
                                        <span th:text="|${admin?.area}|"></span>
                                    </div>

                            </div>
                        </div>
                    </div>


                    <div class="col-6 mt-3">
                        <div class="card bg-danger px-3 py-2">
                            <div class="card-body text-center">
                                <p class="text-start fw-bold text-white fs-5">Horario</p>
                                <table class="table align-middle ">
                                    <thead>
                                        <tr>
                                            <th scope="col" class="bg-transparent text-white">Día</th>
                                            <th scope="col" class="bg-transparent text-white">Hora</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="horario : ${admin.horarioChamba}">
                                            <td class="bg-transparent text-white" th:text="${horario.dias}"></td>
                                            <td class="bg-transparent text-white" th:text="${horario.horas}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    

                </div>



                </div>

            </div>
    
        </div>

        

    </main>

    <div th:replace="~{fragments/fragment_footer :: footer}"></div>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/JS/Contabilidad.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
