<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <header class="sticky-top">
        <div class=" bg-body shadow-sm">
            <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
        </div>
    </header>

    <main>
        <!-- PAGINA 1 -->
        <div class="">
            <div class="container d-flex flex-column justify-content-start flex-grow-1 min-vh-100 mt-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="mb-0 fs-2 text-danger fw-bold">MÉTRICAS CLAVES DEL SISTEMA</p>
                        <span class="text-secondary fs-5 ">Estado de las principales métricas durante la presente semana</span>
                    </div>

                    <form action="" class="form-group w-25">
                        <select name="" id="" class="form-select">
                            <option value="">Ingresos del día</option>
                            <option value="">Clientes activos</option>
                            <option value="">Pagos rechazados de la semana</option>
                            <option value="">Suscripciones de la semana</option>
                            <option value="">Notificaciones no leídas</option>
                        </select>
                    </form>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center ">
                                <i class="bi bi-cash-coin text-success fs-2 mb-0"></i>
                                <h5 class="mt-2 mb-1 text-success">Ingresos del día</h5>
                                <div class="fs-4 fw-bold text-success">S/ 1,250</div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center ">
                                <i class="bi bi-people-fill text-primary fs-2"></i>
                                <h5 class="mt-2 mb-1 text-primary">Clientes activos</h5>
                                <div class="fs-4 fw-bold text-primary">85</div>
                            </div>
                        </div>
                    </div>
      
                    <div class="col">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center ">
                                <i class="bi bi-x-circle-fill text-danger fs-2"></i>
                                <h5 class="mt-2 mb-1 text-danger">Pagos rechazados de la semana</h5>
                                <div class="fs-4 fw-bold text-danger">5</div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center ">
                                <i class="bi bi-box-seam-fill text-info fs-2"></i>
                                <h5 class="mt-2 mb-1 text-info">Suscripciones realizadas</h5>
                                <div class="fs-4 fw-bold text-info">92</div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center ">
                                <i class="bi bi-calendar-x-fill text-warning fs-2"></i>
                                <h5 class="mt-2 mb-1 text-warning">Notificaciones no leídas</h5>
                                <div class="fs-4 fw-bold text-warning">78</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card rounded-4 shadow-sm mt-4 border-0 mb-5">
                    <div class="card-body"> 
                        <h5 class="card-title text-danger">Ingresos del día</h5>
                        <p class="text-muted small">Dinero generado por los pagos</p>
                        <div class="d-flex justify-content-center">
                            <div style="height: 250px; width: 550px;">
                                <canvas id="ingresos"></canvas>
                            </div>
                        </div>
                    </div>
                    
                </div>

            </div>
        </div>

    

    </main>

    <div th:replace="~{fragments/fragment_footer :: footer}"></div>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/JS/Contabilidad.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
