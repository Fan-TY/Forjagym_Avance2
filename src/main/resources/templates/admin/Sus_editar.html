<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <header class="sticky-top">
        <div class=" bg-body shadow-sm">
            <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
        </div>
    </header>

    <main>
        <!-- PAGINA 1 -->
        <div class="">
            <div class="container d-flex flex-column justify-content-start flex-grow-1 min-vh-100">

                <div class="text-center p-3 w-75 mx-auto mb-4 text-danger mt-4 rounded-4 border border-danger border-2 ">
                    <p class="mb-0 fs-2 fw-bold">EDITAR SUSCRIPCIÓN</p>
                    <p class="mb-0 fs-5">Modifica los datos del plan seleccionado</p>
                </div>


                <div class="card w-75 mx-auto  border-0 shadow-sm px-4 py-3 mb-4">
                    <div class="card-body">
                        <form action="" class="form-group">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="" class="form-label">Tipo de suscripción</label>
                                    <select name="tipo" id="tipo" class="form-select" onchange="toggleProductos(this)">
                                        <option value="entrenamiento" selected>Plan de entrenamiento</option>
                                        <option value="productos">Membresia a productos</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="" class="form-label">Nombre de  la suscripción</label>
                                    <input type="text" class="form-control" value="Fuerza Total">
                                </div>

                                <div class="col-6">
                                    <label for="" class="form-label">Precio</label>
                                    <input type="number" class="form-control" value="180">
                                </div>

                                
                                <div class="col-6">
                                    <label for="" class="form-label">Tiempo de duración (Meses)</label>
                                    <input type="number" class="form-control" value="1">
                                </div>


                                <div class="col-6">
                                    <label for="" class="form-label">Estado de la suscripción</label>
                                    <select name="" id="" class="form-select">
                                        <option value="" selected>Activo</option>
                                        <option value="">Inactivo</option>
                                        <option value="">Borrador</option>
                                    </select>
                                </div>    

                                <div class="col-12">
                                    <label for="" class="form-label">Contenido de la suscripción</label>
                                    <textarea name="" id="" class="form-control" rows="6">Acceso ilimitado a zonas y máquinarias&#10;Acompañamiento de un Coach personalizado&#10;Evaluación gratuita</textarea>
                                </div>

                                <div class="col-12 d-none" id="productos-contenido">
                                    <label for="productos" class="form-label">Productos de la suscripción</label>
                                    <textarea name="productos" id="productos" class="form-control" rows="3" placeholder=""></textarea>                                    
                                </div>

                                <button class="btn btn-danger text-white" onclick="window.location.href='/admin/Sus_administrar.html'" type="button">Guardar cambios</button>
                                <button class="btn btn-outline-danger" onclick="window.location.href='/admin/Sus_administrar.html'" type="button">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>


    </main>

    <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
    
<script src="/JS/sus_editar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
