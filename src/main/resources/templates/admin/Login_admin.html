<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>


<main>

    <div class="min-vh-100 d-flex justify-content-center">
        <div class="col-6 bg-danger d-flex flex-column text-white justify-content-center p-5">
            <p class="display-5 mb-1 fw-bold">Administra sin límites</p>
            <p class="fs-4">Lidera la operación de tu gimnasio con control total sobre clientes, suscripciones, pagos y métricas de rendimiento</p>
        </div>


        <div class="col-6 justify-content-center d-flex flex-column p-5">
                <span class="fs-3 fw-bold text-danger mb-4">
                    <i class="bi bi-fire fs-2"></i>
                    FORJAGYM
                </span>
            <p class="display-6 text-secondary fw-bold mb-0">Iniciar sesión</p>
            <p class="fs-5 text-secondary">Área administrativa</p>
            <form th:action="@{/admin/login}" method="post" class="form-group text-secondary">
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <label for="" class="form-label">Código de usuario</label>
                <input type="text" name="codigo" class="form-control" placeholder="ADM001" required>

                <label for="" class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="**********" required>

                <div>
                    <button class="btn btn-outline-danger mt-4" type="submit">Ingresar</button>
                </div>
            </form>
        </div>

    </div>



</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
