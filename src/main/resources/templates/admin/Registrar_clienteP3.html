<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <header class="sticky-top">
        <div class=" bg-body shadow-sm">
            <div th:replace="~{fragments/fragment_navbar :: navbar}"></div>
        </div>
    </header>

    <main>
        <!-- PAGINA 1 -->
        <div class="">
            <div class="container d-flex flex-column justify-content-start flex-grow-1 min-vh-100 mt-5">
                <p class="fs-2 text-danger fw-bold mb-0">MÉTODO DE PAGO</p>
                <p class="text-secondary fs-5">Elige el medio por el cual el socio efectuará sus pagos</p>

                <div class="row">
                    <div class="col">
                        <div class="card text-secondary py-3 border shadow-sm p-2">
                            <div class="card-body">
                                <h5 class="text-danger fw-bold">Pago inicial</h5>
                                <p>Selecciona la forma en que el socio pagará su primera cuota</p>

                                <div  class="border border-2 p-2 rounded-3 mt-2" data-bs-toggle="collapse" data-bs-target="#formTarjeta" role="button">
                                    <div class="form-check text-secondary">
                                        <input type="radio" class="form-check-input" name="metodoPago" id="Tarjeta">
                                        <i class="bi bi-credit-card-fill me-1"></i>
                                        <label for="form-check-label">Tarjeta de credito</label>  
                                    </div>
                                </div>

                                <div  class="collapse mt-2 p-3 border border-2 rounded-3" id="formTarjeta">
                                    <form action="">
                                        
                                        <div class="row gap-2">
                                            <div>
                                                <label for="">Número de tarjeta</label>
                                                <input type="text" placeholder="xxxx xxxx xxxx xxxx" class="form-control">
                                            </div>
                                            <div class="col">
                                                <label for="">Vencimiento</label>
                                                <input type="text" placeholder="xx/xx" class="form-control">
                                            </div>
                                            <div class="col">
                                                <label for="">CVV</label>
                                                <input type="text" placeholder="xxx" class="form-control">
                                            </div>

                                            <div class="col-12">
                                                <label for="">Nombre del titular</label>
                                                <input type="text" placeholder="Richie Espinoza" class="form-control">
                                            </div>

                                            <div class="col pt-2">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" id="check1">
                                                    <label class="form-check-label" for="check1">
                                                        Acepto los términos y condiciones
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                
                            </div>
                        </div>

                        <button class="btn btn-outline-danger mt-3" onclick="window.location.href='/admin/Registrar_clienteP4.html'">Continuar</button>
                        <button class="btn btn-outline-danger mt-3" onclick="window.location.href='/admin/Registrar_clienteP2.html'">Volver</button>
                    </div>

                    

                    <div class="col-4 my-auto flex-column justify-content-center d-flex ">
                        <div class="d-flex gap-3 align-items-center ms-5">
                            <div class="rounded-circle bg-danger justify-content-center align-items-center text-center d-flex text-white fw-bold" style="height: 40px; width: 40px;">
                                1
                            </div>
                            <span class="text-danger fs-5">Completar datos del usuario</span>
                        </div>
                        
                        <div class="d-flex gap-3 align-items-center mt-4 ms-5">
                            <div class="rounded-circle bg-danger justify-content-center align-items-center d-flex text-white fw-bold" style="height: 40px; width: 40px;">
                                2
                            </div>
                            <span class="text-danger fs-5">Seleccionar plan</span>
                        </div>

                        <div class="d-flex gap-3 align-items-center mt-4 ms-5">
                            <div class="rounded-circle bg-danger justify-content-center align-items-center  d-flex text-white fw-bold" style="height: 40px; width: 40px;">
                                3
                            </div>
                            <span class="text-danger fs-5 fw-bold">Completar compra</span>
                        </div>

                        <div class="d-flex gap-3 align-items-center mt-4 ms-5">
                            <div class="rounded-circle border border-danger  justify-content-center align-items-center  d-flex text-secondary fw-bold" style="height: 40px; width: 40px;">
                                4
                            </div>
                            <span class="text-secondary fs-5">¡Listo! Usuario registrado</span>
                        </div>
                    </div>

                </div>

                

            </div>

        
        </div>


    </main>

    <div th:replace="~{fragments/fragment_footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
